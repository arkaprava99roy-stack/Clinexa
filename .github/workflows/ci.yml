name: Clinexa CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: lint + unit tests ──────────────────────────────────────────────
  backend-ci:
    name: Backend — Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app/ tests/ || true   # non-blocking until Phase 9

      - name: Format check (black)
        run: black --check app/ tests/ || true

      - name: Run unit tests (no Supabase required)
        env:
          SUPABASE_URL: ""
          SUPABASE_ANON_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
          GROQ_API_KEY: ""
          JWT_SECRET: test-secret
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/clinexa_test"
        run: |
          cd ..
          pytest tests/test_rule_engine.py -v --tb=short

  # ── Frontend: type-check + build ────────────────────────────────────────────
  frontend-ci:
    name: Frontend — Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit || true   # non-blocking until Phase 9

      - name: Lint
        run: npm run lint || true

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
        run: npm run build

  # ── Docker Compose smoke test ───────────────────────────────────────────────
  docker-smoke:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Create backend .env
        run: |
          cp backend/.env.example backend/.env
          echo "JWT_SECRET=ci-test-secret" >> backend/.env

      - name: Create frontend .env.local
        run: cp frontend/.env.example frontend/.env.local

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 5
          done

      - name: Verify health endpoint
        run: curl -sf http://localhost:8000/health | grep '"status":"ok"'

      - name: Tear down
        if: always()
        run: docker compose down -v
